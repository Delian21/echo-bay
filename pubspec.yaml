name: superapp
description: >-
  Echo Bay — capture the day before it fades. A local-first life-logging
  social app: The Square (photo journal), The Vault (secure offline-first
  messaging), The Hallway (community Board and Dorms), The Landline
  (calls). Display name per docs/NAMING.md; the Dart package name stays
  `superapp` until the mechanical rename follow-up.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # state
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # functional errors
  fpdart: ^1.1.0

  # db / storage
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # network (contracted now, real later)
  dio: ^5.7.0
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.0.3

  # router
  go_router: ^17.5.0

  # media (feed pipeline)
  cached_network_image: ^3.4.1
  share_plus: ^13.3.0 # system share sheet for post share-cards
  web: ^1.1.0 # browser interop for the web download path (IO seam)

  # misc
  uuid: ^4.5.0
  intl: ^0.19.0
  collection: ^1.19.1
  image_picker: ^1.2.3
  blurhash_dart: ^1.2.1
  # Windows build note: flutter_secure_storage and flutter_local_notifications
  # below ship C++ Windows impls that require the Visual Studio "C++ ATL for
  # latest v14x build tools" optional component. See ARCHITECTURE.md §1a.
  flutter_secure_storage: ^11.2.0 # ATL-dependent on Windows (§1a)
  flutter_local_notifications: ^22.3.1 # ATL-dependent on Windows (§1a)
  record: ^7.1.1
  audioplayers: ^6.8.1
  drift_flutter: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.28.0
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  # OFL-licensed handwriting face (Caveat, SIL Open Font License 1.1) —
  # the Golden Hour display voice: prompt headers, module titles,
  # journal-style annotations. Body/UI text stays on Roboto.
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
