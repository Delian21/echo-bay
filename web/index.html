<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Echo Bay — a local-first analog sketchbook of a town square: journal posts, encrypted chats, and a keepsake wall, all on your device.">

  <!-- Browser chrome tint: the app's warm sepia paper. -->
  <meta name="theme-color" content="#F5EFE2">

  <!-- Open Graph: how shared links preview. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Echo Bay">
  <meta property="og:title" content="Echo Bay">
  <meta property="og:description" content="A local-first analog sketchbook of a town square: journal posts, encrypted chats, and a keepsake wall — all on your device.">
  <meta property="og:url" content="https://echo-bay.netlify.app">
  <meta property="og:image" content="https://echo-bay.netlify.app/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="The Echo Bay app icon">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Echo Bay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Echo Bay</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
