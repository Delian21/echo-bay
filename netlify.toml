# Netlify config for Echo Bay's web build.
#
# Netlify runs the Flutter web build itself; the repo no longer carries
# build output (build/ is gitignored). Every push to the linked branch
# deploys a fresh build. The base image ships a stable Flutter SDK with
# Flutter on PATH; the web assets (sqlite3.wasm, drift_worker.js) are
# committed in web/ so no extra download step is needed.

[build]
  publish = "build/web"
  command = "flutter build web --release"

# Flutter web is a single-page app: any deep link (e.g. /vault/conversation/1)
# must fall back to index.html so the router can take over after boot.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the immutable build artifacts (hashed filenames); never cache
# the entry documents so new deploys are picked up immediately.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

# Stale-deploy fixes: these override the /*.js immutable rule above (later
# rules win on Netlify). The service workers and version.json MUST be
# revalidated on every load, or browsers keep the old worker — which keeps
# serving the old app shell from its cache — after a deploy. Both workers
# are covered: flutter_service_worker.js (Flutter's generated stub) and
# service-worker.js (Echo Bay's real offline worker).
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
